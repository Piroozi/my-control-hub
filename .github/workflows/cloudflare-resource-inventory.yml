name: Cloudflare Resource Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVABILITY_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Build private resource inventory
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse

          base = "https://api.cloudflare.com/client/v4"
          old_token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          obs_token = os.environ.get("CLOUDFLARE_OBSERVABILITY_TOKEN", "").strip()
          tg_token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          tg_chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          def api_get(url, token):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "MyControlHub-Inventory/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.getcode(), json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read().decode())
                  except Exception:
                      return e.code, {}
              except Exception:
                  return 0, {}

          def send_telegram(text):
              if not tg_token or not tg_chat:
                  raise SystemExit("Telegram secrets are missing")
              payload = urllib.parse.urlencode({
                  "chat_id": tg_chat,
                  "text": text,
              }).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{tg_token}/sendMessage",
                  data=payload,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.getcode()

          if not old_token or not obs_token:
              raise SystemExit("Cloudflare secrets are missing")

          # Determine account ID without exposing it.
          account_id = None
          code, data = api_get(f"{base}/accounts?per_page=50", old_token)
          if code == 200 and isinstance(data.get("result"), list) and data["result"]:
              account_id = data["result"][0].get("id")

          if not account_id:
              code, data = api_get(f"{base}/zones?per_page=50", old_token)
              zones = data.get("result") if isinstance(data, dict) else None
              if code == 200 and isinstance(zones, list) and zones:
                  account_id = (zones[0].get("account") or {}).get("id")

          if not account_id:
              raise SystemExit("Could not determine Cloudflare account ID")

          # Workers
          workers = []
          code, data = api_get(
              f"{base}/accounts/{account_id}/workers/scripts",
              obs_token,
          )
          if code == 200 and isinstance(data.get("result"), list):
              for item in data["result"]:
                  name = item.get("id") or item.get("name")
                  if name:
                      workers.append(name)

          # D1
          d1 = []
          page = 1
          while True:
              code, data = api_get(
                  f"{base}/accounts/{account_id}/d1/database?page={page}&per_page=100",
                  obs_token,
              )
              if code != 200:
                  break
              result = data.get("result")
              if not isinstance(result, list):
                  break
              for item in result:
                  name = item.get("name")
                  if name:
                      d1.append(name)
              info = data.get("result_info") or {}
              total_pages = info.get("total_pages") or 1
              if page >= total_pages:
                  break
              page += 1

          # KV
          kv = []
          page = 1
          while True:
              code, data = api_get(
                  f"{base}/accounts/{account_id}/storage/kv/namespaces?page={page}&per_page=100",
                  obs_token,
              )
              if code != 200:
                  break
              result = data.get("result")
              if not isinstance(result, list):
                  break
              for item in result:
                  title = item.get("title")
                  if title:
                      kv.append(title)
              info = data.get("result_info") or {}
              total_pages = info.get("total_pages") or 1
              if page >= total_pages:
                  break
              page += 1

          # R2
          r2 = []
          cursor = None
          while True:
              url = f"{base}/accounts/{account_id}/r2/buckets?per_page=100"
              if cursor:
                  url += "&cursor=" + urllib.parse.quote(cursor)
              code, data = api_get(url, obs_token)
              if code != 200:
                  break
              result = data.get("result") or {}
              buckets = result.get("buckets") if isinstance(result, dict) else None
              if not isinstance(buckets, list):
                  break
              for item in buckets:
                  name = item.get("name")
                  if name:
                      r2.append(name)
              info = data.get("result_info") or {}
              cursor = info.get("cursor")
              if not cursor:
                  break

          def section(title, items):
              if not items:
                  return f"\n{title} (0)\n—"
              return f"\n{title} ({len(items)})\n" + "\n".join(f"• {x}" for x in items)

          text = (
              "🧭 My Control Hub — Cloudflare Resource Inventory\n"
              + section("Workers", workers)
              + section("D1", d1)
              + section("KV", kv)
              + section("R2", r2)
          )

          send_telegram(text)

          # Public Actions log: counts only, not resource names.
          print(f"Workers: {len(workers)}")
          print(f"D1: {len(d1)}")
          print(f"KV: {len(kv)}")
          print(f"R2: {len(r2)}")
          print("Private inventory sent to Telegram.")
          PY
