name: My Control Hub Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: my-control-hub-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare
        id: cf
        shell: bash
        run: |
          set -euo pipefail

          previous="unknown"
          if [ -f status.json ]; then
            previous="$(python3 -c 'import json; print(json.load(open("status.json")).get("cloudflare","unknown"))' 2>/dev/null || echo unknown)"
          fi

          state="error"
          overall="critical"
          http_code="000"

          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            http_code="$(curl -sS -o /tmp/cf.json -w "%{http_code}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/user/tokens/verify" || true)"

            api_ok="$(python3 -c 'import json; d=json.load(open("/tmp/cf.json")); print("yes" if d.get("success") is True else "no")' 2>/dev/null || echo no)"

            if [ "$http_code" = "200" ] && [ "$api_ok" = "yes" ]; then
              state="ok"
              overall="ok"
            fi
          fi

          changed="false"
          if [ "$state" != "$previous" ]; then
            changed="true"
            changed_at="$(date -u +"%Y-%m-%d %H:%M UTC")"

            python3 -c 'import json,sys; overall,state,ts=sys.argv[1:4]; json.dump({"overall":overall,"cloudflare":state,"changed_at":ts},open("status.json","w"),indent=2)' \
              "$overall" "$state" "$changed_at"
          fi

          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          echo "Previous state: $previous"
          echo "Current state:  $state"
          echo "HTTP code:      $http_code"
          echo "Changed:        $changed"

      - name: Telegram test on manual run
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets are missing."
            exit 1
          fi

          response="$(curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🟢 My Control Hub: Telegram connection test successful.")"

          ok="$(printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("yes" if d.get("ok") is True else "no")' 2>/dev/null || echo no)"

          if [ "$ok" != "yes" ]; then
            echo "Telegram test failed."
            echo "$response"
            exit 1
          fi

          echo "Telegram test succeeded."

      - name: Telegram alert on Cloudflare state change
        if: steps.cf.outputs.changed == 'true'
        shell: bash
        run: |
          set -u

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets are missing; skipping state-change alert."
            exit 0
          fi

          if [ "${{ steps.cf.outputs.state }}" = "ok" ]; then
            text="🟢 My Control Hub: Cloudflare connection recovered and is healthy."
          else
            text="🔴 My Control Hub: Cloudflare connection/API problem detected."
          fi

          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            >/dev/null || true

      - name: Commit dashboard state change
        if: steps.cf.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "my-control-hub-bot"
          git config user.email "actions@users.noreply.github.com"

          git add status.json

          if git diff --cached --quiet; then
            echo "No dashboard change to commit."
            exit 0
          fi

          git commit -m "chore: update monitoring state"
          git push

      - name: Final health result
        shell: bash
        run: |
          if [ "${{ steps.cf.outputs.state }}" != "ok" ]; then
            echo "Cloudflare monitoring is unhealthy."
            exit 1
          fi

          echo "Cloudflare monitoring is healthy."
