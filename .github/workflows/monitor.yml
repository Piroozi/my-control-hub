name: My Control Hub Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: "250671931"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Monitor Cloudflare and notify Telegram
        shell: bash
        run: |
          set -u

          previous="$(python3 -c 'import json; try: print(json.load(open("status.json")).get("cloudflare","unknown")) except Exception: print("unknown")' 2>/dev/null || echo unknown)"

          cloudflare="error"
          overall="critical"
          http_code="000"

          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            http_code="$(curl -sS -o /tmp/cf.json -w "%{http_code}"               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               -H "Content-Type: application/json"               "https://api.cloudflare.com/client/v4/user/tokens/verify" || true)"

            cf_ok="$(python3 -c 'import json; d=json.load(open("/tmp/cf.json")); print("yes" if d.get("success") is True else "no")' 2>/dev/null || echo no)"

            if [ "$http_code" = "200" ] && [ "$cf_ok" = "yes" ]; then
              cloudflare="ok"
              overall="ok"
            fi
          fi

          changed_at="$(date -u +"%Y-%m-%d %H:%M UTC")"

          python3 -c 'import json,sys; overall,cf,ts=sys.argv[1:4]; json.dump({"overall":overall,"cloudflare":cf,"changed_at":ts},open("status.json","w"),indent=2)'             "$overall" "$cloudflare" "$changed_at"

          send_telegram () {
            local text="$1"

            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
              echo "Telegram token is empty."
              return 1
            fi

            response="$(curl -sS -X POST               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"               --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"               --data-urlencode "text=${text}" || true)"

            tg_ok="$(printf '%s' "$response" | python3 -c 'import json,sys; try: d=json.load(sys.stdin); print("yes" if d.get("ok") is True else "no") except Exception: print("no")')"

            echo "Telegram send result: $tg_ok"

            if [ "$tg_ok" != "yes" ]; then
              echo "Telegram response:"
              echo "$response"
              return 1
            fi

            return 0
          }

          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            send_telegram "🟢 My Control Hub: Telegram connection test successful." || exit 1
          fi

          if [ "$cloudflare" != "$previous" ]; then
            if [ "$cloudflare" = "error" ]; then
              send_telegram "🔴 My Control Hub: Cloudflare connection/API problem detected." || true
            elif [ "$cloudflare" = "ok" ] && [ "$previous" = "error" ]; then
              send_telegram "🟢 My Control Hub: Cloudflare connection recovered." || true
            fi
          fi

          echo "Previous Cloudflare state: $previous"
          echo "Current Cloudflare state:  $cloudflare"
          echo "Cloudflare HTTP code:      $http_code"

      - name: Commit dashboard status
        shell: bash
        run: |
          set -e

          if git diff --quiet -- status.json; then
            echo "No dashboard change."
            exit 0
          fi

          git config user.name "my-control-hub-bot"
          git config user.email "actions@users.noreply.github.com"

          git add status.json
          git commit -m "chore: update monitoring state"
          git push

      - name: Fail workflow if Cloudflare is unhealthy
        shell: bash
        run: |
          state="$(python3 -c 'import json; print(json.load(open("status.json")).get("cloudflare","unknown"))')"

          if [ "$state" != "ok" ]; then
            echo "Cloudflare monitoring is unhealthy: $state"
            exit 1
          fi

          echo "Cloudflare monitoring is healthy."
