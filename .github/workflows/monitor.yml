name: My Control Hub Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          previous="$(python3 -c 'import json; print(json.load(open("status.json")).get("cloudflare","unknown"))' 2>/dev/null || echo unknown)"

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            cloudflare="unconfigured"
            overall="warning"
          else
            code="$(curl -sS -o /tmp/cloudflare.json -w "%{http_code}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/user/tokens/verify" || true)"

            success="$(python3 -c 'import json; d=json.load(open("/tmp/cloudflare.json")); print("true" if d.get("success") is True else "false")' 2>/dev/null || echo false)"

            if [ "$code" = "200" ] && [ "$success" = "true" ]; then
              cloudflare="ok"
              overall="ok"
            else
              cloudflare="error"
              overall="critical"
            fi
          fi

          if [ "$cloudflare" != "$previous" ]; then
            changed_at="$(date -u +"%Y-%m-%d %H:%M UTC")"

            python3 -c '
          import json,sys
          overall,cloudflare,changed_at=sys.argv[1:4]

          with open("status.json","w") as f:
              json.dump({
                  "overall": overall,
                  "cloudflare": cloudflare,
                  "changed_at": changed_at
              }, f, indent=2)
          ' "$overall" "$cloudflare" "$changed_at"
          fi

      - name: Find Telegram Chat ID and send test
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -u

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is empty."
            exit 1
          fi

          echo "Checking Telegram bot token..."

          getme="$(curl -sS \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")"

          bot_ok="$(printf '%s' "$getme" | python3 -c '
          import json,sys

          try:
              d=json.load(sys.stdin)
              print("yes" if d.get("ok") else "no")
          except:
              print("invalid")
          ')"

          echo "Telegram token check: $bot_ok"

          if [ "$bot_ok" != "yes" ]; then
            echo "ERROR: Telegram token is invalid or Telegram API rejected it."
            echo "$getme"
            exit 1
          fi

          echo "Token is valid. Reading messages..."

          updates="$(curl -sS \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates")"

          count="$(printf '%s' "$updates" | python3 -c '
          import json,sys

          try:
              d=json.load(sys.stdin)
              print(len(d.get("result", [])))
          except:
              print(-1)
          ')"

          echo "Telegram update count: $count"

          chat_id="$(printf '%s' "$updates" | python3 -c '
          import json,sys

          d=json.load(sys.stdin)
          found=""

          for item in reversed(d.get("result", [])):
              msg=item.get("message") or item.get("edited_message")

              if not msg:
                  continue

              chat=msg.get("chat", {})

              if chat.get("type") == "private":
                  found=str(chat.get("id"))
                  break

          print(found)
          ')"

          if [ -z "$chat_id" ]; then
            echo "ERROR: No private chat found."
            echo "Open the bot in Telegram, press Start, send hello, then run this workflow again."
            exit 1
          fi

          echo "Telegram Chat ID found: $chat_id"

          response="$(curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${chat_id}" \
            --data-urlencode "text=🟢 My Control Hub: Telegram Alert فعال شد و ارتباط با موفقیت برقرار است.")"

          send_ok="$(printf '%s' "$response" | python3 -c '
          import json,sys

          try:
              d=json.load(sys.stdin)
              print("yes" if d.get("ok") else "no")
          except:
              print("invalid")
          ')"

          echo "Telegram send test: $send_ok"

          if [ "$send_ok" != "yes" ]; then
            echo "ERROR: Test message could not be sent."
            echo "$response"
            exit 1
          fi

          echo "SUCCESS: Telegram is fully connected."

      - name: Update dashboard if state changed
        shell: bash
        run: |
          if git diff --quiet -- status.json; then
            echo "No state change."
            exit 0
          fi

          git config user.name "my-control-hub-bot"
          git config user.email "actions@users.noreply.github.com"

          git add status.json
          git commit -m "chore: update monitoring state"
          git push
