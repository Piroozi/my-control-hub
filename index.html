<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Control Hub</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;color:#172033;margin:0}header{background:#0f172a;color:#fff;padding:24px}main{max-width:900px;margin:28px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px}.label{font-size:13px;color:#64748b}.value{font-size:21px;font-weight:700;margin-top:8px}.ok{color:#15803d}.warn{color:#b45309}.bad{color:#b91c1c}.muted{color:#64748b}</style></head><body><header><h1>My Control Hub</h1><div>مرکز مستقل پایش زیرساخت‌ها</div></header><main><div class="grid"><div class="card"><div class="label">وضعیت مانیتورینگ</div><div id="overall" class="value muted">در انتظار اولین بررسی…</div></div><div class="card"><div class="label">Cloudflare</div><div id="cf" class="value muted">نامشخص</div></div><div class="card"><div class="label">آخرین تغییر وضعیت</div><div id="updated" class="value">—</div></div><div class="card"><div class="label">نسخه</div><div class="value">V1 Foundation</div></div></div></main><script>(async()=>{try{const r=await fetch('./status.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)return;const s=await r.json();let o=document.getElementById('overall'),c=document.getElementById('cf');o.textContent=s.overall==='ok'?'سالم':s.overall==='warning'?'هشدار':'بحرانی';o.className='value '+(s.overall==='ok'?'ok':s.overall==='warning'?'warn':'bad');c.textContent=s.cloudflare==='ok'?'متصل و سالم':s.cloudflare==='unconfigured'?'تنظیم نشده':'خطا';c.className='value '+(s.cloudflare==='ok'?'ok':s.cloudflare==='unconfigured'?'warn':'bad');document.getElementById('updated').textContent=s.changed_at||'—'}catch(e){}})();</script></body></html>
